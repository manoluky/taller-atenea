name: CI-ClonandoAPPyEjecutandoTest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      pmongo:
        image: mongo:6.0
        ports:
          - 27017:27017

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: 6007
      VITE_API_URL: http://localhost:6007

    steps:
      - name: Checkout repositorio actual
        uses: actions/checkout@v2

      - name: Clonar repo Athenea redux bank
        run: |
          git clone git@github.com:AAtenea-Conocimientos/redux-athenea-bank.git

      - name: Crear carpeta backend y archivo .env
        run: |
          mkdir -p app/backend
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" > app/backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> app/backend/.env
          echo "PORT=${{ env.PORT }}" >> app/backend/.env
          echo "VITE_API_URL=${{ env.VITE_API_URL }}" >> app/backend/.env

      - name: Instalar dependencias backend
        run: |
          cd app/backend
          npm install

      - name: Construir backend
        run: |
          cd app/backend
          npm run dev > backend.log 2>&1 &

      - name: Instalar wait-on
        run: npm install -g wait-on

      - name: Esperar a que el backend esté listo
        run: wait-on tcp:6007

      - name: Instalar dependencias frontend
        run: |
          cd app/frontend
          npm install
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Esperar frontend
        run: wait-on http://localhost:3000

      - name: Instalar y ejecutar pruebas
        run: |
          cd test
          npm install
          npx playwright install
          npx playwright test --reporte=html

      - name: Guardar reporte de pruebas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ./playwright-report
